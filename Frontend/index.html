
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense | Food Business Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN -->
    <section id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>🥬 StockSense</h1>
            <p>SMART STOCK. FRESH FOOD.</p>
            <h2>Welcome Back!</h2>

            <form id="loginForm">
                <label>Your Name</label>
                <input type="text" id="loginName"
                    placeholder="Enter your name" required>

                <label>Login Role</label>
                <select id="loginRole">
                    <option>Admin</option>
                    <option>Shop Owner</option>
                    <option>Staff</option>
                </select>

                <button type="submit">Login</button>
            </form>
        </div>
    </section>

    <!-- MAIN APPLICATION -->
    <div id="app" class="app hidden">

        <aside class="sidebar">
            <div class="brand">
                <h2>🥬 StockSense</h2>
                <small>Smart Stock. Fresh Food.</small>
            </div>

            <p class="nav-label">MAIN MENU</p>

            <nav id="navigation">
                <button class="nav-link active" data-page="dashboard">▦ Dashboard</button>
                <button class="nav-link" data-page="inventory">📦 Inventory</button>
                <button class="nav-link" data-page="products">🛒 Sales & Products</button>
                <button class="nav-link" data-page="purchases">🧾 Purchases</button>
                <button class="nav-link" data-page="suppliers">🚚 Suppliers</button>
                <button class="nav-link" data-page="batches">◷ Batch & Expiry</button>
                <button class="nav-link" data-page="reports">📊 Reports</button>
                <button class="nav-link" data-page="notifications">🔔 Notifications</button>
                <button class="nav-link" data-page="settings">⚙ Settings</button>
            </nav>

            <div class="sidebar-bottom">
                <p id="userNameLabel">User</p>
                <small id="userRoleLabel">Staff</small>
                <button id="logoutBtn" class="logout">Logout</button>
            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <p>STOCKSENSE MANAGEMENT SYSTEM</p>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <span class="online">● System Online</span>
            </header>

            <section id="pageContent"></section>

            <footer>
                © 2026 StockSense | Food Business Management System
            </footer>

        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
